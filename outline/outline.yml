# outline
# 

services:
  outline:
    image: docker.getoutline.com/outlinewiki/outline:latest
    env_file: ${DC_DOCKERCOMPOSE}/outline/outline.env
    expose:
      - "3000"
    volumes:
      - ${DC_DOCKERDATA_NVME}/outline/storage-data:/var/lib/outline/data
    depends_on:
      - postgres
      - redis

  redis:
    image: redis
    env_file: ${DC_DOCKERCOMPOSE}/outline/outline.env
    expose:
      - "6379"
    # volumes:
    #  - ./redis.conf:/redis.conf
    command: ["redis-server", "/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 3

  postgres:
    image: postgres:18
    env_file: ${DC_DOCKERCOMPOSE}/outline/outline.env
    expose:
      - "5432"
    volumes:
      - ${DC_DOCKERDATA_NVME}/outline/database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "outline", "-U", "user"]
      interval: 30s
      timeout: 20s
      retries: 3
    environment:
      POSTGRES_USER: ${OLC_POSTGRES_USER}
      POSTGRES_PASSWORD: ${OLC_POSTGRES_PASSWORD}
      POSTGRES_DB: ${OLC_POSTGRES_DB}

  https-portal:
    image: steveltn/https-portal
    env_file: ${DC_DOCKERCOMPOSE}/outline/outline.env
    ports:
      - '80:80'
      - '443:443'
    links:
      - outline
    restart: always
    volumes:
      - ${DC_DOCKERDATA_NVME}/outline/https-portal-data:/var/lib/https-portal
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 30s
      timeout: 20s
      retries: 3
    environment:
      DOMAINS: 'docs.mycompany.com -> http://outline:3000'
      STAGE: 'production'
      WEBSOCKET: 'true'
      CLIENT_MAX_BODY_SIZE: '0'

