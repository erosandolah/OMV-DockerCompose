services:
  postgresql:
    container_name: authentik-postgresql
    environment:
      # From the not git versioned global.env
      - TZ=${MY_TZ}
    networks:
      - authentik
  server:
    container_name: authentik-server
    labels:
      - "traefik.enable=true"
      # Figyeljük a kívánt domaint
      - "traefik.http.routers.authentik.rule=Host(`authentik.${MY_FQDN}`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls=true"
      # Megadjuk a Traefiknek, hogy az Authentik belsőleg a 9000-es porton (HTTP) várja a kéréseket
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
      # Ha a NetBird traefik-je certresolver-t használ (pl. 'letsencrypt'), azt is megadhatod:
      - "traefik.http.routers.authentik.tls.certresolver=letsencrypt"
    environment:
      # From the not git versioned global.env
      - TZ=${MY_TZ}
    user: "${APPUSER_UID}:${APPUSER_GID}"
    networks:
      authentik:
        aliases:
          - authentik.${MY_FQDN}
      netbird:
        aliases:
          - authentik.${MY_FQDN}
  worker:
    container_name: authentik-worker
    environment:
      # From the not git versioned global.env
      - TZ=${MY_TZ}
    user: "${APPUSER_UID}:${APPUSER_GID}"
    networks:
      - authentik
      - netbird

networks:
  authentik:
    name: authentik # To avoid authentik_default
    driver: bridge
  eposz-local:
    external: true
  netbird:
    external: true