services:
  opencloud:
    image: opencloudeu/opencloud:latest
    container_name: opencloud
    restart: always
    environment:
      - OPENCLOUD_INIT_INSTANCE=true
      - JWT_SECRET=a_long_random_string_of_your_choice_12345
      - OPENCLOUD_JWT_SECRET=a_long_random_string_of_your_choice_12345
      - IDM_ADMIN_PASSWORD=YourSecurePassword123
      
      # 1. Swapped the hardcoded IP out for your NetBird VPN domain
      - OPENCLOUD_URL=https://eposz.nb.vpn
      - PROXY_TLS=true
      - PROXY_INSECURE=true
      
      # 2. Updated Collabora endpoints to use the internal VPN domain
      - APP_PROVIDER_EXTERNAL_APPS=text/docx:https://eposz.nb.vpn,text/xlsx:https://eposz.nb.vpn,text/pptx:https://eposz.nb.vpn
      - COLLABORATION_ENABLED=true
      - COLLABORATION_APP_PRODUCT=Collabora
      - COLLABORATION_APP_ADDR=https://eposz.nb.vpn
      - COLLABORATION_APP_INSECURE=true
    volumes:
      - ${DC_DOCKERDATA_RAID}/opencloud/config:/etc/opencloud
      - ${DC_DOCKERDATA_RAID}/opencloud/data:/var/lib/opencloud
    ports:
      # Binds directly to port 9200. Safe since it's behind a firewall.
      - "9200:9200"
    depends_on:
      - collabora

  collabora:
    image: collabora/code:latest
    container_name: opencloud_collabora
    restart: always
    cap_add:
      - SYS_ADMIN
