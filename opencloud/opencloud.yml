      - password=AnotherSecurePassword456
      - EXTRA_PARAMS=--o:ssl.enable=true --o:ssl.termination=false --o:ssl.ssl_verify=false --o:jail.mount_jail_tree=false
    ports:
      # Binds to port 9980 on the host machinery
      - "9980:9980"

